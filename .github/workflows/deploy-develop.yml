name: Deploy Develop Branch (Staging Environment)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync myshowcase folder to Develop S3 Bucket
        run: |
          aws s3 sync myshowcase/ s3://${{ secrets.DEV_AWS_S3_BUCKET }} --delete

      - name: Invalidate Develop CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.DEV_CF_DISTRIBUTION_ID }} \
          --paths "/*"
